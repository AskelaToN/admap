<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="820" height="260" role="img" aria-label="admap - Active Directory enumeration and attack-path advisor">
  <defs>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#39d0d8"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#39d0d8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="818" height="258" rx="22" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- attack-path graph: nodes connected up to a highlighted domain-admin node -->
  <g stroke="url(#edge)" stroke-width="2.4" opacity="0.85" fill="none">
    <line x1="86" y1="180" x2="150" y2="120"/>
    <line x1="86" y1="180" x2="120" y2="196"/>
    <line x1="150" y1="120" x2="210" y2="86"/>
    <line x1="150" y1="120" x2="205" y2="160"/>
    <line x1="205" y1="160" x2="255" y2="120"/>
    <line x1="210" y1="86" x2="255" y2="120"/>
  </g>

  <!-- ordinary nodes -->
  <g fill="#161b22" stroke="#3fb950" stroke-width="2.6">
    <circle cx="86" cy="180" r="12"/>
    <circle cx="120" cy="196" r="9"/>
    <circle cx="150" cy="120" r="12"/>
    <circle cx="210" cy="86" r="11"/>
    <circle cx="205" cy="160" r="10"/>
  </g>

  <!-- compromised / domain-admin node (the goal) -->
  <circle cx="255" cy="120" r="16" fill="#161b22" stroke="#f0b429" stroke-width="3" filter="url(#glow)"/>
  <!-- little crown on the DA node -->
  <path d="M245 112 l4 6 6 -8 6 8 4 -6 -2 12 h-16 z" fill="#f0b429"/>

  <!-- wordmark -->
  <text x="310" y="126" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="88" font-weight="800" letter-spacing="-2" fill="url(#wm)">admap</text>

  <!-- terminal-style accent -->
  <text x="313" y="168" font-family="'JetBrains Mono','Consolas','Menlo',monospace"
        font-size="19" fill="#39d0d8">&gt;_ ad enumeration &amp; attack-path advisor</text>

  <!-- safety tagline -->
  <text x="314" y="200" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="17" fill="#8b949e">enumeration only &#183; no auto-exploit &#183; no lockouts</text>
</svg>
