<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="admap social preview">
  <defs>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#39d0d8"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#39d0d8"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#121a2b"/>
      <stop offset="1" stop-color="#0d1117"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="6" y="6" width="1268" height="628" rx="28" fill="none" stroke="#30363d" stroke-width="3"/>

  <!-- attack-path graph, top center -->
  <g transform="translate(470,70)">
    <g stroke="url(#edge)" stroke-width="4" opacity="0.85" fill="none">
      <line x1="40" y1="120" x2="140" y2="60"/>
      <line x1="40" y1="120" x2="95" y2="150"/>
      <line x1="140" y1="60" x2="240" y2="40"/>
      <line x1="140" y1="60" x2="215" y2="120"/>
      <line x1="215" y1="120" x2="300" y2="80"/>
      <line x1="240" y1="40" x2="300" y2="80"/>
    </g>
    <g fill="#161b22" stroke="#3fb950" stroke-width="4">
      <circle cx="40" cy="120" r="16"/>
      <circle cx="95" cy="150" r="12"/>
      <circle cx="140" cy="60" r="16"/>
      <circle cx="240" cy="40" r="14"/>
      <circle cx="215" cy="120" r="13"/>
    </g>
    <circle cx="300" cy="80" r="22" fill="#161b22" stroke="#f0b429" stroke-width="5" filter="url(#glow)"/>
    <path d="M286 68 l6 9 8 -12 8 12 6 -9 -3 18 h-22 z" fill="#f0b429"/>
  </g>

  <!-- wordmark -->
  <text x="640" y="360" text-anchor="middle"
        font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="180" font-weight="800" letter-spacing="-4" fill="url(#wm)">admap</text>

  <!-- tagline -->
  <text x="640" y="425" text-anchor="middle"
        font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="36" font-weight="600" fill="#c9d1d9">Active Directory enumeration &amp; attack-path advisor</text>

  <!-- safety line -->
  <text x="640" y="472" text-anchor="middle"
        font-family="'JetBrains Mono','Consolas','Menlo',monospace"
        font-size="26" fill="#39d0d8">enumeration only &#183; no auto-exploit &#183; no lockouts</text>

  <!-- tool pills -->
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" text-anchor="middle">
    <text x="640" y="545">nmap &#183; NetExec &#183; Impacket &#183; BloodHound &#183; Certipy &#183; kerbrute</text>
  </g>

  <!-- footer -->
  <text x="640" y="600" text-anchor="middle"
        font-family="'JetBrains Mono','Consolas','Menlo',monospace"
        font-size="24" fill="#6e7681">github.com/AskelaToN/admap</text>
</svg>
